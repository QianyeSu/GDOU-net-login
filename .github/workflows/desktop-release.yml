name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update
        required: true
        default: desktop-v0.1.15
      publish_release:
        description: Publish a GitHub Release after building (leave off for validation)
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "desktop-v*"

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Setup Windows Code Signing Certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PWD: ${{ secrets.WINDOWS_CERTIFICATE_PWD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:WINDOWS_CERTIFICATE) {
            Write-Host "==> Importing Windows certificate from Secret..."
            $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
            $pfxPath = "$env:RUNNER_TEMP\windows_cert.pfx"
            [IO.File]::WriteAllBytes($pfxPath, $certBytes)
            $pwd = [Security.SecureString]::new()
            if ($env:WINDOWS_CERTIFICATE_PWD) {
              $pwd = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PWD -AsPlainText -Force
            }
            try {
              $certs = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $pwd | Where-Object { $_.HasPrivateKey })
              if ($certs.Count -ne 1) { throw "Expected exactly one signing certificate with a private key in the PFX." }
              $cert = $certs[0]
            } finally {
              Remove-Item -Force $pfxPath
            }
            Write-Host "Imported custom certificate into Cert:\CurrentUser\My."
          } else {
            Write-Warning "No persistent Windows signing certificate configured; generating a per-run self-signed certificate (not publicly trusted)."
            $cert = New-SelfSignedCertificate -Type CodeSigningCert `
              -Subject "CN=GDOU Net Login Developer (Qianye Su), O=GDOU, C=CN" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -NotAfter (Get-Date).AddYears(10)
            Write-Host "Created certificate with Thumbprint: $($cert.Thumbprint)"
          }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

          if ($cert.Subject -eq $cert.Issuer) {
            # Trust only the public certificate on this disposable hosted runner
            # so WinVerifyTrust can verify integrity. Never ship/install this trust
            # on users' machines or describe it as CA/SmartScreen trust.
            $publicCertPath = "$env:RUNNER_TEMP\windows_signing_public.cer"
            Export-Certificate -Cert $cert -FilePath $publicCertPath | Out-Null
            Import-Certificate -FilePath $publicCertPath -CertStoreLocation "Cert:\CurrentUser\Root" | Out-Null
            Remove-Item -Force $publicCertPath
            Write-Warning "Self-signed certificate trusted for this CI job only; end users will still see untrusted-publisher warnings."
          }

      - name: Smoke test Windows signing command
        shell: pwsh
        working-directory: desktop
        run: |
          $ErrorActionPreference = "Stop"
          $config = Get-Content tauri.conf.json -Raw | ConvertFrom-Json
          $command = $config.bundle.windows.signCommand
          $testFile = Join-Path $env:RUNNER_TEMP "Signing smoke test.exe"
          Copy-Item "$env:WINDIR\System32\where.exe" $testFile
          try {
            $signArgs = @($command.args | ForEach-Object { if ($_ -eq '%1') { $testFile } else { $_ } })
            & $command.cmd @signArgs
            if ($LASTEXITCODE -ne 0) { throw "Signing smoke test failed: $LASTEXITCODE" }
            $signature = Get-AuthenticodeSignature -LiteralPath $testFile
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
              throw "Signing smoke test used an invalid or unexpected signature."
            }
          } finally {
            Remove-Item -LiteralPath $testFile -Force
          }

      - name: Build Windows installer
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ../frontend/node_modules/.bin/tauri build --target x86_64-pc-windows-msvc --bundles nsis --ci

      - name: Collect release assets
        shell: pwsh
        run: |
          $releaseTag = "${{ github.event.inputs.release_tag || github.ref_name }}"
          $repo = "${{ github.repository }}"
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "desktop/target/x86_64-pc-windows-msvc/release/gdou-net-login.exe" "release-assets/gdou-net-login-windows-x86_64.exe"
          & "desktop/scripts/sign-windows.ps1" "release-assets/gdou-net-login-windows-x86_64.exe"
          $installer = Get-ChildItem "desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*setup.exe" | Select-Object -First 1
          $installerSignature = Get-ChildItem "desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*setup.exe.sig" | Select-Object -First 1
          Copy-Item $installer.FullName "release-assets/gdou-net-login-windows-x86_64-setup.exe"
          Copy-Item $installerSignature.FullName "release-assets/gdou-net-login-windows-x86_64-setup.exe.sig"

          $config = Get-Content "desktop/tauri.conf.json" -Raw | ConvertFrom-Json
          $releaseInstaller = Get-Item "release-assets/gdou-net-login-windows-x86_64-setup.exe"
          $signature = Get-Content "release-assets/gdou-net-login-windows-x86_64-setup.exe.sig" -Raw
          $latest = [ordered]@{
            version = $config.version
            notes = "See GitHub Releases for details."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature.Trim()
                url = "https://github.com/$repo/releases/download/$releaseTag/$($releaseInstaller.Name)"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 6 | Set-Content "release-assets/latest.json" -Encoding utf8

      - name: Verify Windows artifact signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($file in Get-ChildItem release-assets -Filter '*.exe') {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate -or
                $signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
              throw "Invalid or unexpected signature on $($file.Name): $($signature.Status) - $($signature.StatusMessage)"
            }
            Write-Host "Verified $($file.Name); timestamp present: $($null -ne $signature.TimeStamperCertificate)"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: release-assets/*
          if-no-files-found: error

  macos:
    name: macOS (Apple Silicon arm64, macOS 15+)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Apple Certificate (if configured in Secrets)
        id: cert
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          if [ -n "${MACOS_CERTIFICATE:-}" ]; then
            echo "==> Importing certificate from Secret..."
            CERT_PATH="$RUNNER_TEMP/build_cert.p12"
            KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
            KEYCHAIN_PWD="temporary-ci-keychain-pass"

            echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERT_PATH"

            security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

            security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -E "Apple Development|Developer ID Application|Apple Distribution|Mac Developer" | head -1 | awk -F'"' '{print $2}')
            if [ -z "$IDENTITY" ]; then
              IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep ')' | head -1 | awk -F'"' '{print $2}')
            fi
            echo "IDENTITY=$IDENTITY" >> "$GITHUB_OUTPUT"
          else
            echo "==> No MACOS_CERTIFICATE secret found, using Ad-hoc self-signing (-)..."
            echo "IDENTITY=-" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Package macOS App & DMG
        run: |
          bash macos/scripts/build_app.sh "${{ steps.cert.outputs.IDENTITY }}"

      - name: Verify macOS app and disk image
        run: |
          codesign --verify --deep --strict --verbose=2 macos/build/GDOU-net-login.app
          hdiutil verify release-assets/gdou-net-login-macos-arm64.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-assets
          path: release-assets

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-assets
          path: release-assets

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt || true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: release-assets/*
          overwrite_files: true
          body: |
            ## 下载

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | macOS (15+ Apple Silicon) | `gdou-net-login-macos-arm64.dmg` | 原生 Swift 客户端 (M系列芯片通用) |
            | Windows x64 | `gdou-net-login-windows-x86_64-setup.exe` | 推荐，普通安装包 |
            | Windows x64 | `gdou-net-login-windows-x86_64.exe` | 免安装直接运行 |
            | Windows x64 | `latest.json` / `.sig` | 自动更新使用 |

            ## 校验

            下载后可使用 `SHA256SUMS.txt` 校验文件完整性。

            ## 说明

            - **macOS 安装说明**：首次打开如遇系统安全提示，请前往「系统设置」->「隐私与安全性」底部点击「仍要打开」，或在访达中右键点击 App 选择「打开」；亦可在终端执行一次：`xattr -cr /Applications/GDOU-net-login.app` 移除隔离属性。
            - **密码安全**：macOS 版密码保存至系统钥匙串 (Keychain Access)，Windows 版密码保存至凭据管理器。
            - **网络规则**：程序只用于授权账号的正常校园网认证，不修改系统代理、TUN 或路由表。
