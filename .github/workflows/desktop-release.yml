name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to update
        required: true
        default: desktop-v0.1.8
  push:
    tags:
      - "desktop-v*"

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Windows installer
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ../frontend/node_modules/.bin/tauri build --target x86_64-pc-windows-msvc --bundles nsis --ci

      - name: Collect release assets
        shell: pwsh
        run: |
          $releaseTag = "${{ github.event.inputs.release_tag || github.ref_name }}"
          $repo = "${{ github.repository }}"
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "desktop/target/x86_64-pc-windows-msvc/release/gdou-net-login.exe" "release-assets/gdou-net-login-windows-x86_64.exe"
          Copy-Item "desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis/*setup.exe" "release-assets/"
          Copy-Item "desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis/*setup.exe.sig" "release-assets/"

          $config = Get-Content "desktop/tauri.conf.json" -Raw | ConvertFrom-Json
          $installer = Get-ChildItem "release-assets" -Filter "*setup.exe" | Select-Object -First 1
          $signature = Get-Content "$($installer.FullName).sig" -Raw
          $encodedInstallerName = [System.Uri]::EscapeDataString($installer.Name)
          $latest = [ordered]@{
            version = $config.version
            notes = "See GitHub Releases for details."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature.Trim()
                url = "https://github.com/$repo/releases/download/$releaseTag/$encodedInstallerName"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 6 | Set-Content "release-assets/latest.json" -Encoding utf8

          Get-ChildItem release-assets -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $(Split-Path $_.Path -Leaf)"
          } | Set-Content "release-assets/SHA256SUMS.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdou-net-login-windows-x86_64
          path: release-assets/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: release-assets/*
          overwrite_files: true
          body: |
            ## 下载

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | Windows x64 | `GDOU Net Login_*_x64-setup.exe` | 推荐，普通安装包 |
            | Windows x64 | `gdou-net-login-windows-x86_64.exe` | 免安装直接运行 |
            | Windows x64 | `latest.json` / `.sig` | 自动更新使用 |

            ## 校验

            下载后可使用 `SHA256SUMS.txt` 校验文件完整性。

            ## 说明

            - 本版本用于广东海洋大学校园网登录与自动重连。
            - Windows 安装包暂未做代码签名，首次运行时可能出现系统安全提示。
            - 密码保存到 Windows 凭据管理器，不写入本地配置文件。
            - 程序不会修改系统代理、路由、DNS 或第三方网络工具配置。
            - 从旧版升级时，建议直接运行新版安装包覆盖安装，不需要先卸载；正常升级不会清空已保存密码。

            ## 主要变化 (v0.1.8)

            - **启动稳定性改进**：针对部分环境下程序启动后闪退或页面未正常显示的问题进行了改进。
            - **修复开机启动提示乱码**：兼容中文 Windows 的注册表命令输出，避免错误显示乱码。
            - **修复关闭开机启动误报**：当启动项本来不存在时，关闭操作会正常完成，不再提示失败。
            - **统一开机启动文案**：设置页和操作提示统一使用「开机启动」。
