name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update
        required: true
        default: desktop-v0.1.11
  push:
    tags:
      - "desktop-v*"

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Windows installer
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ../frontend/node_modules/.bin/tauri build --target x86_64-pc-windows-msvc --bundles nsis --ci

      - name: Collect release assets
        shell: pwsh
        run: |
          $releaseTag = "${{ github.event.inputs.release_tag || github.ref_name }}"
          $repo = "${{ github.repository }}"
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "desktop/target/x86_64-pc-windows-msvc/release/gdou-net-login.exe" "release-assets/gdou-net-login-windows-x86_64.exe"
          $installer = Get-ChildItem "desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*setup.exe" | Select-Object -First 1
          $installerSignature = Get-ChildItem "desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*setup.exe.sig" | Select-Object -First 1
          Copy-Item $installer.FullName "release-assets/gdou-net-login-windows-x86_64-setup.exe"
          Copy-Item $installerSignature.FullName "release-assets/gdou-net-login-windows-x86_64-setup.exe.sig"

          $config = Get-Content "desktop/tauri.conf.json" -Raw | ConvertFrom-Json
          $releaseInstaller = Get-Item "release-assets/gdou-net-login-windows-x86_64-setup.exe"
          $signature = Get-Content "release-assets/gdou-net-login-windows-x86_64-setup.exe.sig" -Raw
          $latest = [ordered]@{
            version = $config.version
            notes = "See GitHub Releases for details."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature.Trim()
                url = "https://github.com/$repo/releases/download/$releaseTag/$($releaseInstaller.Name)"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 6 | Set-Content "release-assets/latest.json" -Encoding utf8

          Get-ChildItem release-assets -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $(Split-Path $_.Path -Leaf)"
          } | Set-Content "release-assets/SHA256SUMS.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: gdou-net-login-windows-x86_64
          path: release-assets/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: release-assets/*
          overwrite_files: true
          body: |
            ## 下载

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | Windows x64 | `gdou-net-login-windows-x86_64-setup.exe` | 推荐，普通安装包 |
            | Windows x64 | `gdou-net-login-windows-x86_64.exe` | 免安装直接运行 |
            | Windows x64 | `latest.json` / `.sig` | 自动更新使用 |

            ## 校验

            下载后可使用 `SHA256SUMS.txt` 校验文件完整性。

            ## 说明

            - 本版本用于广东海洋大学校园网登录与自动重连。
            - Windows 安装包暂未做代码签名，首次运行时可能出现系统安全提示。
            - 密码保存到 Windows 凭据管理器，不写入本地配置文件。
            - 程序不会修改系统代理、路由、DNS 或第三方网络工具配置。
            - 从旧版升级时，建议直接运行新版安装包覆盖安装，不需要先卸载；正常升级不会清空已保存密码。

            ## 主要变化 (v0.1.11)

            - **校园网自动重连稳定性修复**：Portal 在线状态区分在线、确认离线、未知状态和接口失败，避免状态接口异常时误触发重复登录。
            - **登录出口恢复能力增强**：配置的绑定 IP 失效时尝试回退到当前有效校园网 IPv4；无可用出口时暂停重连并提示原因。
            - **Windows 网卡诊断修复**：统一处理 UTF-8/GBK 命令输出，改善中文系统下的网卡、代理、路由和 TUN 诊断。
            - **开机启动修复**：直接读写并校验 Windows 当前用户启动项，持久化开机启动开关，避免重启后状态回退。
            - **重连时间记录**：设置页显示最近一次自动重连或重连自测时间；检测到更新时切换为绿色新版按钮。
            - **认证流程测试补充**：增加 Mock Portal 测试，覆盖已在线、登录、状态接口失败、未知状态、Challenge 错误和重连恢复。
